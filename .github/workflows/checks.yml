name: Tests

on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    name: Go checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chessli_test
          POSTGRES_PASSWORD: chessli_test
          POSTGRES_DB: chessli_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chessli_test -d chessli_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10

    env:
      CHESSLI_TEST_DATABASE_URL: postgres://chessli_test:chessli_test@localhost:5432/chessli_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: make check

      - name: Run all tests with the race detector
        run: make test-race

      - name: Build
        run: make build

    timeout-minutes: 5
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
